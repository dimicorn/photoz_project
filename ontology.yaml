# Онтология проекта photo-z: классы, отношения, правила.
# Источник истины для графа проекта: по ней создаются заметки классов в ontology/
# (.venv/bin/python -m src.graph classes) и проверяются связи (checks/check_graph.py).

ontology: photo-z-репрезентативность
goal: >
  Записывать ход исследования photo-z так, чтобы по графу проекта можно было ответить:
  на какой выборке обучен и на какой проверен каждый результат, каким методом и в какой
  метрике он получен, чем проверен, какие ограничения действуют, на какие источники
  опираются гипотезы и методы и каким запросом найден каждый источник.

competency_questions:
  - На какой выборке обучен и на каких выборках оценён каждый результат photo-z?
  - Какие результаты прошли независимую проверку?
  - Какие ограничения (смещение выборки, расхождение определений) действуют на результаты?
  - На какие источники опираются гипотезы и методы и каким запросом найден каждый источник?
  - Какие задачи поставлены, в каком они статусе и чем закрыты?

classes:
  ИнформационныйОбъект:
    parent: null
    definition: объект, который несёт сведения — задача, утверждение, данные, метод, текст
  Процесс:
    parent: null
    definition: то, что происходит во времени — расчёт, проверка, запрос
  Файл:
    parent: null
    definition: файл проекта — таблица, код, текст; узел графа — сам файл, заметка о нём не нужна
  Автор:
    parent: null
    definition: человек — автор опубликованной работы
  Задача:
    parent: ИнформационныйОбъект
    definition: поручение пользователя или его часть; заметки задач в tasks/ ведёт агент
  Утверждение:
    parent: ИнформационныйОбъект
    definition: высказывание, которое может оказаться истинным или ложным
  Гипотеза:
    parent: Утверждение
    definition: утверждение о качестве photo-z, которое проверяют в эксперименте
  Результат:
    parent: Утверждение
    definition: утверждение, полученное в эксперименте, с числом, метрикой и условиями
  Выборка:
    parent: ИнформационныйОбъект
    definition: набор галактик с фотометрией и спектроскопическим z, используемый для обучения или оценки
  Метод:
    parent: ИнформационныйОбъект
    definition: способ оценки photo-z по фотометрии
  Метрика:
    parent: ИнформационныйОбъект
    definition: мера качества photo-z с формулой по dz = (z_phot − z_spec)/(1 + z_spec)
  Источник:
    parent: ИнформационныйОбъект
    definition: опубликованная работа, на которую ссылаются; текст — в paper/ или library/
  Ограничение:
    parent: ИнформационныйОбъект
    definition: известное смещение выборки, дефект данных или расхождение соглашений
  Отчёт:
    parent: ИнформационныйОбъект
    definition: текст об исследовании для читателя; заметка отчёта — сам файл в reports/
  Эксперимент:
    parent: Процесс
    definition: расчёт photo-z, который проверяет гипотезу
  Проверка:
    parent: Процесс
    definition: независимая проверка результата другим способом
  ЗапросКГрафу:
    parent: Процесс
    definition: обращение к внешнему графу знаний — источник, инструмент и аргументы, дата, число найденных записей

properties:
  подзадачаОт:    {domain: Задача, range: Задача, characteristics: [транзитивное]}
  решает:         {domain: [Эксперимент, Проверка, ЗапросКГрафу], range: Задача}
  выполняет:      {domain: Отчёт, range: Задача}
  проверяет:      {domain: Эксперимент, range: Гипотеза}
  обучаетсяНа:    {domain: Эксперимент, range: Выборка}
  оцениваетсяНа:  {domain: Эксперимент, range: Выборка}
  применяет:      {domain: Эксперимент, range: Метод}
  даёт:           {domain: Эксперимент, range: Результат}
  выраженВ:       {domain: Результат, range: Метрика}
  подтверждает:   {domain: Результат, range: Гипотеза}
  опровергает:    {domain: Результат, range: Гипотеза}
  проверенЧерез:  {domain: Результат, range: Проверка}
  ограничивает:   {domain: Ограничение, range: [Выборка, Результат, Метод, Метрика]}
  основанаНа:     {domain: [Гипотеза, Метод, Метрика], range: Источник}
  описывает:      {domain: Отчёт, range: [Эксперимент, Результат]}
  ссылаетсяНа:    {domain: Отчёт, range: Источник}
  хранитсяВ:      {domain: [Выборка, Результат, Источник], range: Файл}
  реализованВ:    {domain: [Эксперимент, Проверка, Метод], range: Файл}
  найденЗапросом: {domain: Источник, range: ЗапросКГрафу}
  написан:        {domain: Источник, range: Автор}
  цитирует:       {domain: Источник, range: Источник}

# Атрибуты — свойства со значением из списка (в заметке — поле в начале файла).
attributes:
  status:
    domain: Задача
    values: [открыта, в работе, выполнена, заблокирована, принята]
  oa_status:
    domain: Источник
    values: [diamond, gold, hybrid, green, bronze, closed]

rules:
  - id: П1
    text: Каждый эксперимент проверяет хотя бы одну гипотезу.
    dl: "Эксперимент ⊑ ∃проверяет.Гипотеза"
    check: {kind: some, class: Эксперимент, property: проверяет, target: Гипотеза}
  - id: П2
    text: Каждый результат получен в каком-то эксперименте.
    dl: "Результат ⊑ ∃даёт⁻.Эксперимент"
    check: {kind: some_inverse, class: Результат, property: даёт, source: Эксперимент}
  - id: П3
    text: Принятый результат — результат, прошедший хотя бы одну проверку.
    dl: "ПринятыйРезультат ≡ Результат ⊓ ∃проверенЧерез.Проверка"
    check: {kind: defined, name: ПринятыйРезультат, class: Результат, property: проверенЧерез, target: Проверка}
  - id: П4
    text: Результат не может одновременно подтверждать и опровергать одну гипотезу.
    dl: "DisjointObjectProperties(подтверждает опровергает)"
    check: {kind: disjoint_properties, properties: [подтверждает, опровергает]}
  - id: П5
    text: Каждая выборка указывает на файл, в котором лежит.
    dl: "Выборка ⊑ ∃хранитсяВ.Файл"
    check: {kind: some, class: Выборка, property: хранитсяВ, target: Файл}
  - id: П6
    text: Каждый эксперимент обучается хотя бы на одной выборке и оценивается хотя бы на одной.
    dl: "Эксперимент ⊑ ∃обучаетсяНа.Выборка ⊓ ∃оцениваетсяНа.Выборка"
    check: {kind: some_all, class: Эксперимент, properties: [обучаетсяНа, оцениваетсяНа], target: Выборка}
  - id: П7
    text: Каждый результат выражен в какой-то метрике.
    dl: "Результат ⊑ ∃выраженВ.Метрика"
    check: {kind: some, class: Результат, property: выраженВ, target: Метрика}
  - id: П8
    text: Каждый отчёт ссылается хотя бы на один источник.
    dl: "Отчёт ⊑ ∃ссылаетсяНа.Источник"
    check: {kind: some, class: Отчёт, property: ссылаетсяНа, target: Источник}
  - id: П9
    text: Выполненная задача — задача со статусом «выполнена» или «принята».
    dl: "ВыполненнаяЗадача ≡ Задача ⊓ ∃status.{выполнена, принята}"
    check: {kind: defined_value, name: ВыполненнаяЗадача, class: Задача, attribute: status, values: [выполнена, принята]}
  - id: П10
    text: Выполненную задачу закрывает эксперимент, проверка, запрос, отчёт либо у неё есть подзадачи.
    dl: "ВыполненнаяЗадача ⊑ ∃решает⁻.⊤ ⊔ ∃выполняет⁻.⊤ ⊔ ∃подзадачаОт⁻.⊤"
    check: {kind: some_inverse_any, class: ВыполненнаяЗадача, properties: [решает, выполняет, подзадачаОт]}
  - id: П11
    text: Задача выполнена, только если выполнены все её подзадачи.
    dl: "ВыполненнаяЗадача ⊑ ∀подзадачаОт⁻.ВыполненнаяЗадача"
    check: {kind: all_inverse, class: ВыполненнаяЗадача, property: подзадачаОт, source: ВыполненнаяЗадача}
  - id: П12
    text: В заметке выполненной задачи есть раздел «Итог» — что сделано и чем проверено.
    dl: "— (правило оформления, проверяется по тексту заметки)"
    check: {kind: section, class: ВыполненнаяЗадача, section: Итог}
  - id: Л1
    text: Каждый источник указывает запрос к внешнему графу, которым он найден или сверен.
    dl: "Источник ⊑ ∃найденЗапросом.ЗапросКГрафу"
    check: {kind: some, class: Источник, property: найденЗапросом, target: ЗапросКГрафу}
  - id: Л2
    text: У каждого источника записан хотя бы один автор.
    dl: "Источник ⊑ ∃написан.Автор"
    check: {kind: some, class: Источник, property: написан, target: Автор}
